<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">

<title>GraphX · 函数绘图器</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
}

:root{

    --bg:#f4f6fb;
    --surface:#ffffff;
    --surface2:#f8fafc;

    --text:#111827;
    --muted:#6b7280;

    --border:#e5e7eb;

    --grid:#e7eaf0;
    --axis:#8b95a7;

    --primary:#4f46e5;
    --primary-dark:#4338ca;
    --primary-soft:#eef2ff;

    --danger:#ef4444;

    --shadow:
        0 12px 35px rgba(15,23,42,.08);
}

body.dark{

    --bg:#090d18;
    --surface:#111827;
    --surface2:#151d2d;

    --text:#f3f4f6;
    --muted:#94a3b8;

    --border:#273247;

    --grid:#202a3b;
    --axis:#66758d;

    --primary:#818cf8;
    --primary-dark:#6366f1;
    --primary-soft:#1d2440;

    --shadow:
        0 16px 45px rgba(0,0,0,.35);
}

body{

    font-family:
        "Inter",
        "SF Pro Display",
        "SF Pro Text",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        "PingFang SC",
        sans-serif;

    font-size:14px;
    font-weight:450;

    letter-spacing:-0.01em;

    background:
        radial-gradient(
            circle at 5% 0%,
            rgba(99,102,241,.10),
            transparent 28%
        ),
        radial-gradient(
            circle at 95% 100%,
            rgba(139,92,246,.08),
            transparent 30%
        ),
        var(--bg);

    color:var(--text);

    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
}

button,
input{
    font:inherit;
}

button{
    -webkit-tap-highlight-color:transparent;
}

.app{

    width:100%;
    height:100vh;

    display:flex;
    flex-direction:column;
}


/* =====================================================
   HEADER
===================================================== */

.header{

    height:64px;
    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 17px;

    background:rgba(255,255,255,.82);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border-bottom:1px solid var(--border);

    z-index:20;
}

body.dark .header{
    background:rgba(17,24,39,.82);
}

.brand{

    display:flex;
    align-items:center;

    gap:10px;
}

.brand-logo{

    width:37px;
    height:37px;

    display:grid;
    place-items:center;

    border-radius:11px;

    background:
        linear-gradient(
            135deg,
            #4f46e5,
            #8b5cf6
        );

    color:#fff;

    font-size:19px;
    font-weight:800;

    box-shadow:
        0 7px 18px
        rgba(79,70,229,.25);
}

.brand-name{

    font-size:17px;
    font-weight:750;

    letter-spacing:-0.035em;

    line-height:1.1;
}

.brand-sub{

    margin-top:2px;

    color:var(--muted);

    font-size:10px;
    font-weight:500;
}

.header-actions{

    display:flex;
    align-items:center;

    gap:5px;
}

.icon-btn{

    width:38px;
    height:38px;

    border:0;
    border-radius:10px;

    display:grid;
    place-items:center;

    background:transparent;

    color:var(--text);

    cursor:pointer;

    font-size:17px;

    transition:
        background .18s ease,
        transform .18s ease;
}

.icon-btn:hover{
    background:var(--surface2);
}

.icon-btn:active{
    transform:scale(.94);
}


/* =====================================================
   MAIN
===================================================== */

.main{

    flex:1;
    min-height:0;

    display:flex;

    gap:10px;

    padding:10px;
}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{

    width:330px;
    min-width:330px;

    display:flex;
    flex-direction:column;

    background:var(--surface);

    border:1px solid var(--border);
    border-radius:16px;

    box-shadow:var(--shadow);

    overflow:hidden;
}


/* =====================================================
   SIDEBAR HEADER
===================================================== */

.sidebar-header{

    padding:14px 14px 10px;

    border-bottom:1px solid var(--border);
}

.sidebar-title-row{

    display:flex;

    align-items:center;
    justify-content:space-between;
}

.sidebar-title{

    font-size:14px;
    font-weight:700;

    letter-spacing:-0.02em;
}

.count{

    color:var(--muted);

    font-size:11px;
    font-weight:500;
}

.add-expression{

    width:100%;
    height:38px;

    margin-top:10px;

    border:0;
    border-radius:10px;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--primary-dark)
        );

    color:#fff;

    font-size:13px;
    font-weight:650;

    cursor:pointer;

    box-shadow:
        0 7px 18px
        rgba(79,70,229,.18);

    transition:
        transform .18s ease,
        box-shadow .18s ease;
}

.add-expression:hover{

    transform:translateY(-1px);

    box-shadow:
        0 10px 23px
        rgba(79,70,229,.25);
}

.add-expression:active{
    transform:scale(.99);
}


/* =====================================================
   EXPRESSIONS
===================================================== */

.expressions{

    flex:1;

    min-height:0;

    overflow-y:auto;

    padding:10px;

    scrollbar-width:thin;
}

.expression{

    display:flex;
    align-items:flex-start;

    gap:8px;

    padding:10px;

    margin-bottom:8px;

    border:1px solid var(--border);
    border-radius:13px;

    background:var(--surface2);

    transition:
        border-color .18s ease,
        box-shadow .18s ease,
        transform .18s ease;
}

.expression:hover{
    transform:translateY(-1px);
}

.expression:focus-within{

    border-color:
        rgba(79,70,229,.55);

    box-shadow:
        0 0 0 3px
        rgba(79,70,229,.08);
}

.expression-color{

    width:12px;
    height:12px;

    flex-shrink:0;

    margin-top:7px;

    padding:0;

    border:0;

    border-radius:50%;

    cursor:pointer;
}

.expression-main{

    flex:1;
    min-width:0;
}

.expression-input{

    width:100%;

    border:0;
    outline:0;

    background:transparent;

    color:var(--text);

    font-family:
        "Inter",
        "SF Pro Display",
        "SF Pro Text",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        "PingFang SC",
        sans-serif;

    font-size:16px;
    font-weight:600;

    letter-spacing:-0.025em;

    line-height:1.5;

    padding:2px 0;
}

.expression-input::placeholder{

    color:var(--muted);

    font-weight:500;
}

.domain-input{

    width:100%;

    margin-top:5px;

    padding:0;

    border:0;
    outline:0;

    background:transparent;

    color:var(--muted);

    font-family:
        "Inter",
        "SF Pro Text",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        "PingFang SC",
        sans-serif;

    font-size:11px;
    font-weight:450;

    line-height:1.5;
}

.domain-input::placeholder{

    color:var(--muted);

    opacity:.78;
}

.expression-tools{

    display:flex;
    align-items:center;

    gap:2px;
}

.small-btn{

    width:27px;
    height:27px;

    padding:0;

    border:0;
    border-radius:7px;

    display:grid;
    place-items:center;

    background:transparent;

    color:var(--muted);

    font-size:13px;

    cursor:pointer;

    transition:
        background .16s ease,
        color .16s ease;
}

.small-btn:hover{

    background:var(--surface);

    color:var(--text);
}

.small-btn.delete:hover{

    color:var(--danger);

    background:
        rgba(239,68,68,.08);
}


/* =====================================================
   MATH KEYBOARD
===================================================== */

.math-keyboard{

    flex-shrink:0;

    padding:9px;

    border-top:1px solid var(--border);

    background:var(--surface);
}

.keyboard-tabs{

    display:flex;

    gap:4px;

    margin-bottom:7px;
}

.keyboard-tab{

    flex:1;

    height:27px;

    border:0;
    border-radius:7px;

    background:transparent;

    color:var(--muted);

    font-size:11px;
    font-weight:600;

    cursor:pointer;

    transition:
        background .15s ease,
        color .15s ease;
}

.keyboard-tab:hover{

    background:var(--surface2);

    color:var(--text);
}

.keyboard-tab.active{

    background:var(--primary-soft);

    color:var(--primary);
}

.keyboard-grid{

    display:grid;

    grid-template-columns:
        repeat(6,1fr);

    gap:4px;
}

.keyboard-grid button{

    min-width:0;

    height:32px;

    border:1px solid var(--border);

    border-radius:7px;

    background:var(--surface2);

    color:var(--text);

    font-family:
        "Inter",
        "SF Pro Text",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        sans-serif;

    font-size:12px;
    font-weight:600;

    cursor:pointer;

    transition:
        background .12s ease,
        transform .1s ease,
        border-color .12s ease;
}

.keyboard-grid button:hover{

    background:var(--primary-soft);

    border-color:
        rgba(79,70,229,.25);
}

.keyboard-grid button:active{

    transform:scale(.94);
}

.keyboard-action{

    color:#fff !important;

    border:0 !important;
}

.delete-key{

    background:#64748b !important;
}

.clear-key{

    background:#ef4444 !important;
}

.enter-key{

    grid-column:span 2;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--primary-dark)
        ) !important;
}


/* =====================================================
   GRAPH
===================================================== */

.graph{

    position:relative;

    flex:1;

    min-width:0;
    min-height:0;

    overflow:hidden;

    border:1px solid var(--border);
    border-radius:16px;

    background:var(--surface);

    box-shadow:var(--shadow);
}

#canvas{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    display:block;

    cursor:grab;

    touch-action:none;
}

#canvas.dragging{
    cursor:grabbing;
}


/* =====================================================
   GRAPH TOOLBAR
===================================================== */

.graph-toolbar{

    position:absolute;

    top:12px;
    right:12px;

    display:flex;
    align-items:center;

    gap:4px;

    padding:5px;

    border:1px solid var(--border);
    border-radius:11px;

    background:
        rgba(255,255,255,.82);

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);

    box-shadow:
        0 7px 24px
        rgba(15,23,42,.08);

    z-index:5;
}

body.dark .graph-toolbar{

    background:
        rgba(17,24,39,.82);
}

.toolbar-btn{

    width:34px;
    height:34px;

    border:0;
    border-radius:8px;

    display:grid;
    place-items:center;

    background:transparent;

    color:var(--text);

    cursor:pointer;

    font-size:16px;
}

.toolbar-btn:hover{
    background:var(--surface2);
}

.toolbar-divider{

    width:1px;
    height:22px;

    background:var(--border);

    margin:0 2px;
}


/* =====================================================
   COORDINATES
===================================================== */

.coordinates{

    position:absolute;

    left:12px;
    bottom:12px;

    padding:8px 11px;

    border:1px solid var(--border);
    border-radius:9px;

    background:
        rgba(255,255,255,.82);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    color:var(--muted);

    font-family:
        "SF Mono",
        "Cascadia Code",
        Consolas,
        monospace;

    font-size:10px;
    font-weight:500;

    pointer-events:none;

    z-index:5;
}

body.dark .coordinates{

    background:
        rgba(17,24,39,.82);
}


/* =====================================================
   ZOOM
===================================================== */

.zoom-panel{

    position:absolute;

    right:12px;
    bottom:12px;

    display:flex;
    flex-direction:column;

    overflow:hidden;

    border:1px solid var(--border);
    border-radius:9px;

    background:var(--surface);

    box-shadow:
        0 7px 20px
        rgba(15,23,42,.08);

    z-index:5;
}

.zoom-btn{

    width:38px;
    height:34px;

    padding:0;

    border:0;

    background:transparent;

    color:var(--text);

    font-size:17px;

    cursor:pointer;
}

.zoom-btn:hover{
    background:var(--surface2);
}

.zoom-btn + .zoom-btn{
    border-top:1px solid var(--border);
}


/* =====================================================
   SCROLLBAR
===================================================== */

*::-webkit-scrollbar{

    width:6px;
    height:6px;
}

*::-webkit-scrollbar-track{
    background:transparent;
}

*::-webkit-scrollbar-thumb{

    background:
        rgba(107,114,128,.25);

    border-radius:20px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:720px){

    .header{

        height:57px;

        padding:0 10px;
    }

    .brand-logo{

        width:34px;
        height:34px;

        border-radius:10px;

        font-size:17px;
    }

    .brand-name{
        font-size:15px;
    }

    .brand-sub{
        display:none;
    }

    .icon-btn{

        width:34px;
        height:34px;

        font-size:15px;
    }

    .main{

        flex-direction:column;

        padding:7px;

        gap:7px;
    }

    .sidebar{

        width:100%;
        min-width:0;

        height:300px;

        flex-shrink:0;
    }

    .sidebar-header{

        padding:8px;
    }

    .sidebar-title{
        font-size:13px;
    }

    .add-expression{

        height:32px;

        margin-top:6px;

        font-size:12px;
    }

    .expressions{

        display:flex;

        gap:7px;

        overflow-x:auto;
        overflow-y:hidden;

        padding:7px;
    }

    .expression{

        min-width:255px;

        margin:0;
    }

    .expression-input{
        font-size:15px;
    }

    .domain-input{
        font-size:10px;
    }

    .math-keyboard{
        padding:6px;
    }

    .keyboard-grid{
        gap:3px;
    }

    .keyboard-grid button{

        height:28px;

        font-size:11px;
    }

    .keyboard-tab{
        height:24px;
    }

    .graph-toolbar{

        top:8px;
        right:8px;
    }

    .coordinates{

        left:8px;
        bottom:8px;
    }

    .zoom-panel{

        right:8px;
        bottom:8px;
    }
}

@media(max-width:400px){

    .brand-name{
        font-size:14px;
    }

    .expression{
        min-width:235px;
    }

    .expression-input{
        font-size:14px;
    }

    .toolbar-btn{

        width:31px;
        height:31px;
    }
}

</style>
</head>

            <button

                Enter

        </div>


        <!-- =================================================

        <div
            class="keyboard-grid"

            <button data-key="(">(</button>

            <button data-key="=">=</button>
            <button data-key="x">x</button>


            <button
                class="keyboard-action delete-key"
                data-action="backspace">

                ⌫

            <button
                class="keyboard-action clear-key"
                data-action="clear">

                AC

            </button>


            <button
                class="keyboard-action enter-key"
