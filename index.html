<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">

<title>GraphX · 高级函数绘图器</title>

<style>
/* =====================================================
   GraphX
   Modern UI / Responsive / Lightweight
===================================================== */

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
}

:root{
    --bg:#f4f6fb;
    --surface:#ffffff;
    --surface2:#f8fafc;

    --text:#111827;
    --muted:#6b7280;

    --border:#e5e7eb;

    --grid:#e7eaf0;
    --axis:#8b95a7;

    --primary:#4f46e5;
    --primary-dark:#4338ca;
    --primary-soft:#eef2ff;

    --danger:#ef4444;

    --shadow:
        0 12px 35px rgba(15,23,42,.08);
}

body.dark{
    --bg:#090d18;
    --surface:#111827;
    --surface2:#151d2d;

    --text:#f3f4f6;
    --muted:#94a3b8;

    --border:#273247;

    --grid:#202a3b;
    --axis:#66758d;

    --primary:#818cf8;
    --primary-dark:#6366f1;
    --primary-soft:#1d2440;

    --shadow:
        0 16px 45px rgba(0,0,0,.35);
}


/* =====================================================
   BODY
===================================================== */

body{
    font-family:
        "Inter",
        "SF Pro Display",
        "SF Pro Text",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        "PingFang SC",
        sans-serif;

    font-size:14px;
    font-weight:450;

    letter-spacing:-0.01em;

    background:
        radial-gradient(
            circle at 5% 0%,
            rgba(99,102,241,.10),
            transparent 28%
        ),
        radial-gradient(
            circle at 95% 100%,
            rgba(139,92,246,.08),
            transparent 30%
        ),
        var(--bg);

    color:var(--text);

    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
}


/* =====================================================
   APP
===================================================== */

.app{
    width:100%;
    height:100vh;

    display:flex;
    flex-direction:column;
}


/* =====================================================
   HEADER
===================================================== */

.header{
    height:64px;
    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 17px;

    background:
        rgba(255,255,255,.82);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border-bottom:1px solid var(--border);

    z-index:20;
}

body.dark .header{
    background:
        rgba(17,24,39,.82);
}


.brand{
    display:flex;
    align-items:center;
    gap:10px;
}


.brand-logo{
    width:37px;
    height:37px;

    display:grid;
    place-items:center;

    border-radius:11px;

    background:
        linear-gradient(
            135deg,
            #4f46e5,
            #8b5cf6
        );

    color:#ffffff;

    font-size:19px;
    font-weight:800;

    box-shadow:
        0 7px 18px
        rgba(79,70,229,.25);
}


.brand-name{
    font-size:17px;

    font-weight:750;

    letter-spacing:-0.035em;

    line-height:1.1;
}


.brand-sub{
    margin-top:2px;

    color:var(--muted);

    font-size:10px;
    font-weight:500;

    letter-spacing:.01em;
}


.header-actions{
    display:flex;
    align-items:center;

    gap:5px;
}


.icon-btn{
    width:38px;
    height:38px;

    border:0;
    border-radius:10px;

    display:grid;
    place-items:center;

    background:transparent;
    color:var(--text);

    cursor:pointer;

    font-size:17px;

    transition:
        background .18s ease,
        transform .18s ease;
}


.icon-btn:hover{
    background:var(--surface2);
}


.icon-btn:active{
    transform:scale(.94);
}


/* =====================================================
   MAIN LAYOUT
===================================================== */

.main{
    flex:1;
    min-height:0;

    display:flex;

    gap:10px;

    padding:10px;
}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{
    width:320px;
    min-width:320px;

    display:flex;
    flex-direction:column;

    background:var(--surface);

    border:1px solid var(--border);
    border-radius:16px;

    box-shadow:var(--shadow);

    overflow:hidden;
}


/* =====================================================
   SIDEBAR HEADER
===================================================== */

.sidebar-header{
    padding:14px 14px 10px;

    border-bottom:1px solid var(--border);
}


.sidebar-title-row{
    display:flex;

    align-items:center;
    justify-content:space-between;
}


.sidebar-title{
    font-size:14px;

    font-weight:700;

    letter-spacing:-0.02em;
}


.count{
    color:var(--muted);

    font-size:11px;
    font-weight:500;
}


.add-expression{
    width:100%;
    height:38px;

    margin-top:10px;

    border:0;
    border-radius:10px;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--primary-dark)
        );

    color:#ffffff;

    font-size:13px;
    font-weight:650;

    letter-spacing:-0.01em;

    cursor:pointer;

    box-shadow:
        0 7px 18px
        rgba(79,70,229,.18);

    transition:
        transform .18s ease,
        box-shadow .18s ease,
        filter .18s ease;
}


.add-expression:hover{
    transform:translateY(-1px);

    box-shadow:
        0 10px 23px
        rgba(79,70,229,.25);

    filter:brightness(1.03);
}


.add-expression:active{
    transform:translateY(0) scale(.99);
}


/* =====================================================
   EXPRESSIONS
===================================================== */

.expressions{
    flex:1;

    overflow-y:auto;

    padding:10px;

    scrollbar-width:thin;
}


.expression{
    position:relative;

    display:flex;
    align-items:flex-start;

    gap:8px;

    padding:10px;

    margin-bottom:8px;

    border:1px solid var(--border);
    border-radius:13px;

    background:var(--surface2);

    transition:
        border-color .18s ease,
        box-shadow .18s ease,
        transform .18s ease;
}


.expression:hover{
    transform:translateY(-1px);
}


.expression:focus-within{
    border-color:
        rgba(79,70,229,.55);

    box-shadow:
        0 0 0 3px
        rgba(79,70,229,.08);
}


/* =====================================================
   COLOR
===================================================== */

.expression-color{
    width:12px;
    height:12px;

    flex-shrink:0;

    margin-top:7px;

    padding:0;

    border:0;

    border-radius:50%;

    cursor:pointer;

    box-shadow:
        0 0 0 3px
        rgba(255,255,255,.55);
}


/* =====================================================
   EXPRESSION MAIN
===================================================== */

.expression-main{
    flex:1;

    min-width:0;
}


.expression-input{
    width:100%;

    border:0;
    outline:0;

    background:transparent;

    color:var(--text);

    font-family:
        "Inter",
        "SF Pro Display",
        "SF Pro Text",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        "PingFang SC",
        sans-serif;

    font-size:16px;

    font-weight:600;

    letter-spacing:-0.025em;

    line-height:1.5;

    padding:2px 0;

    -webkit-font-smoothing:antialiased;
}


.expression-input::placeholder{
    color:var(--muted);

    font-weight:500;
}


.domain-input{
    width:100%;

    margin-top:5px;

    padding:0;

    border:0;
    outline:0;

    background:transparent;

    color:var(--muted);

    font-family:
        "Inter",
        "SF Pro Text",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        "PingFang SC",
        sans-serif;

    font-size:11px;

    font-weight:450;

    letter-spacing:-0.01em;

    line-height:1.5;
}


.domain-input::placeholder{
    color:var(--muted);

    opacity:.78;
}


/* =====================================================
   EXPRESSION TOOLS
===================================================== */

.expression-tools{
    display:flex;

    align-items:center;

    gap:2px;
}


.small-btn{
    width:27px;
    height:27px;

    padding:0;

    border:0;
    border-radius:7px;

    display:grid;
    place-items:center;

    background:transparent;
    color:var(--muted);

    font-size:13px;

    cursor:pointer;

    transition:
        background .16s ease,
        color .16s ease;
}


.small-btn:hover{
    background:var(--surface);

    color:var(--text);
}


.small-btn.delete:hover{
    color:var(--danger);

    background:
        rgba(239,68,68,.08);
}


/* =====================================================
   SIDEBAR BOTTOM
===================================================== */

.sidebar-bottom{
    padding:10px;

    border-top:1px solid var(--border);
}


.quick-title{
    margin-bottom:7px;

    color:var(--muted);

    font-size:10px;
    font-weight:550;

    letter-spacing:.01em;
}


.quick-list{
    display:flex;

    flex-wrap:wrap;

    gap:6px;
}


.quick{
    padding:7px 10px;

    border:0;
    border-radius:9px;

    background:var(--primary-soft);
    color:var(--primary);

    font-size:12px;
    font-weight:600;

    letter-spacing:-0.01em;

    cursor:pointer;

    transition:
        transform .15s ease,
        background .15s ease;
}


.quick:hover{
    transform:translateY(-1px);

    background:
        rgba(79,70,229,.14);
}


.quick:active{
    transform:scale(.97);
}


/* =====================================================
   GRAPH
===================================================== */

.graph{
    position:relative;

    flex:1;

    min-width:0;
    min-height:0;

    overflow:hidden;

    border:1px solid var(--border);
    border-radius:16px;

    background:var(--surface);

    box-shadow:var(--shadow);
}


#canvas{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    display:block;

    cursor:grab;

    touch-action:none;
}


#canvas.dragging{
    cursor:grabbing;
}


/* =====================================================
   GRAPH TOOLBAR
===================================================== */

.graph-toolbar{
    position:absolute;

    top:12px;
    right:12px;

    display:flex;

    align-items:center;

    gap:4px;

    padding:5px;

    border:1px solid var(--border);
    border-radius:11px;

    background:
        rgba(255,255,255,.82);

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);

    box-shadow:
        0 7px 24px
        rgba(15,23,42,.08);

    z-index:5;
}


body.dark .graph-toolbar{
    background:
        rgba(17,24,39,.82);
}


.toolbar-btn{
    width:34px;
    height:34px;

    border:0;
    border-radius:8px;

    display:grid;
    place-items:center;

    background:transparent;

    color:var(--text);

    cursor:pointer;

    font-size:16px;

    transition:
        background .16s ease,
        transform .16s ease;
}


.toolbar-btn:hover{
    background:var(--surface2);
}


.toolbar-btn:active{
    transform:scale(.94);
}


.toolbar-divider{
    width:1px;
    height:22px;

    background:var(--border);

    margin:0 2px;
}


/* =====================================================
   COORDINATES
===================================================== */

.coordinates{
    position:absolute;

    left:12px;
    bottom:12px;

    padding:8px 11px;

    border:1px solid var(--border);
    border-radius:9px;

    background:
        rgba(255,255,255,.82);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    color:var(--muted);

    font-family:
        "SF Mono",
        "Cascadia Code",
        Consolas,
        monospace;

    font-size:10px;

    font-weight:500;

    pointer-events:none;

    z-index:5;
}


body.dark .coordinates{
    background:
        rgba(17,24,39,.82);
}


/* =====================================================
   ZOOM PANEL
===================================================== */

.zoom-panel{
    position:absolute;

    right:12px;
    bottom:12px;

    display:flex;
    flex-direction:column;

    overflow:hidden;

    border:1px solid var(--border);
    border-radius:9px;

    background:var(--surface);

    box-shadow:
        0 7px 20px
        rgba(15,23,42,.08);

    z-index:5;
}


.zoom-btn{
    width:38px;
    height:34px;

    padding:0;

    border:0;

    background:transparent;

    color:var(--text);

    font-size:17px;

    cursor:pointer;

    transition:
        background .16s ease;
}


.zoom-btn:hover{
    background:var(--surface2);
}


.zoom-btn + .zoom-btn{
    border-top:1px solid var(--border);
}


/* =====================================================
   SCROLLBAR
===================================================== */

*::-webkit-scrollbar{
    width:6px;
    height:6px;
}

*::-webkit-scrollbar-track{
    background:transparent;
}

*::-webkit-scrollbar-thumb{
    background:
        rgba(107,114,128,.25);

    border-radius:20px;
}

*::-webkit-scrollbar-thumb:hover{
    background:
        rgba(107,114,128,.4);
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:720px){

    .header{
        height:57px;

        padding:
            0 10px;
    }


    .brand-logo{
        width:34px;
        height:34px;

        border-radius:10px;

        font-size:17px;
    }


    .brand-name{
        font-size:15px;
    }


    .brand-sub{
        display:none;
    }


    .icon-btn{
        width:34px;
        height:34px;

        font-size:15px;
    }


    .main{
        flex-direction:column;

        padding:7px;

        gap:7px;
    }


    .sidebar{
        width:100%;
        min-width:0;

        height:178px;

        flex-shrink:0;
    }


    .sidebar-header{
        padding:
            8px;
    }


    .sidebar-title{
        font-size:13px;
    }


    .add-expression{
        height:32px;

        margin-top:6px;

        font-size:12px;
    }


    .expressions{
        display:flex;

        gap:7px;

        overflow-x:auto;
        overflow-y:hidden;

        padding:7px;
    }


    .expression{
        min-width:255px;

        margin:0;
    }


    .expression-input{
        font-size:15px;
    }


    .domain-input{
        font-size:10px;
    }


    .sidebar-bottom{
        display:none;
    }


    .graph-toolbar{
        top:8px;
        right:8px;
    }


    .coordinates{
        left:8px;
        bottom:8px;
    }


    .zoom-panel{
        right:8px;
        bottom:8px;
    }
}


/* =====================================================
   VERY SMALL MOBILE
===================================================== */

@media(max-width:400px){

    .brand-name{
        font-size:14px;
    }


    .expression{
        min-width:235px;
    }


    .expression-input{
        font-size:14px;
    }


    .toolbar-btn{
        width:31px;
        height:31px;
    }
}
</style>
</head>


<body>

<div class="app">


<!-- =================================================
     HEADER
================================================= -->

<header class="header">

    <div class="brand">

        <div class="brand-logo">
            ƒ
        </div>

        <div>

            <div class="brand-name">
                GraphX
            </div>

            <div class="brand-sub">
                Advanced Function Graphing
            </div>

        </div>

    </div>


    <div class="header-actions">

        <button
            class="icon-btn"
            id="themeBtn"
            title="切换主题">
            ◐
        </button>

        <button
            class="icon-btn"
            id="gridBtn"
            title="显示/隐藏网格">
            ▦
        </button>

        <button
            class="icon-btn"
            id="fullscreenBtn"
            title="全屏">
            ⛶
        </button>

        <button
            class="icon-btn"
            id="exportBtn"
            title="导出图片">
            ↓
        </button>

    </div>

</header>


<!-- =================================================
     MAIN
================================================= -->

<main class="main">


<!-- =================================================
     SIDEBAR
================================================= -->

<aside class="sidebar">


    <div class="sidebar-header">

        <div class="sidebar-title-row">

            <div class="sidebar-title">
                表达式
            </div>

            <div
                class="count"
                id="count">
                0 个
            </div>

        </div>


        <button
            class="add-expression"
            id="addBtn">

            ＋ 添加表达式

        </button>

    </div>


    <div
        class="expressions"
        id="expressions">
    </div>


    <div class="sidebar-bottom">

        <div class="quick-title">
            快速添加
        </div>


        <div class="quick-list">

            <button
                class="quick"
                data-exp="sin(x)">
                sin(x)
            </button>

            <button
                class="quick"
                data-exp="cos(x)">
                cos(x)
            </button>

            <button
                class="quick"
                data-exp="x^2">
                x²
            </button>

            <button
                class="quick"
                data-exp="sqrt(x)">
                √x
            </button>

            <button
                class="quick"
                data-exp="1/x">
                1/x
            </button>

            <button
                class="quick"
                data-exp="ln(x)">
                ln(x)
            </button>

            <button
                class="quick"
                data-exp="tan(x)">
                tan(x)
            </button>

        </div>

    </div>


</aside>


<!-- =================================================
     GRAPH
================================================= -->

<section class="graph">


    <canvas id="canvas"></canvas>


    <div class="graph-toolbar">

        <button
            class="toolbar-btn"
            id="resetBtn"
            title="重置视图">
            ⌂
        </button>


        <div class="toolbar-divider"></div>


        <button
            class="toolbar-btn"
            id="minusBtn"
            title="缩小">
            −
        </button>


        <button
            class="toolbar-btn"
            id="plusBtn"
            title="放大">
            ＋
        </button>

    </div>


    <div
        class="coordinates"
        id="coordinates">

        x: 0&nbsp;&nbsp;&nbsp;y: 0

    </div>


    <div class="zoom-panel">

        <button
            class="zoom-btn"
            id="zoomPlus">
            ＋
        </button>

        <button
            class="zoom-btn"
            id="zoomMinus">
            −
        </button>

    </div>


</section>


</main>

</div>


<script>

/* =====================================================
   GraphX Engine
===================================================== */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext(
        "2d",
        {
            alpha:false
        }
    );

const graph =
    document.querySelector(".graph");

const expressionList =
    document.getElementById(
        "expressions"
    );

const count =
    document.getElementById(
        "count"
    );

const coordinates =
    document.getElementById(
        "coordinates"
    );


/* =====================================================
   Colors
===================================================== */

const colors = [

    "#4f46e5",

    "#e11d48",

    "#0891b2",

    "#ea580c",

    "#16a34a",

    "#9333ea",

    "#0284c7",

    "#ca8a04"

];


/* =====================================================
   State
===================================================== */

let items = [

    {
        expression:"sin(x)",

        domain:"",

        color:colors[0],

        visible:true
    }

];


let view = {

    x:0,

    y:0,

    scale:70

};


let width=0;

let height=0;

let dpr=1;

let showGrid=true;

let raf=null;

let dragging=false;

let lastPointer={

    x:0,

    y:0

};


/* =====================================================
   Resize
===================================================== */

function resize(){

    const rect =
        graph.getBoundingClientRect();

    width=rect.width;

    height=rect.height;

    dpr=
        Math.min(
            window.devicePixelRatio||1,
            2
        );


    canvas.width =
        Math.floor(
            width*dpr
        );

    canvas.height =
        Math.floor(
            height*dpr
        );


    canvas.style.width =
        width+"px";

    canvas.style.height =
        height+"px";


    ctx.setTransform(

        dpr,
        0,
        0,
        dpr,
        0,
        0

    );


    draw();
}


window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   Coordinate Conversion
===================================================== */

function worldToScreen(x,y){

    return {

        x:
            width/2+
            (x-view.x)*
            view.scale,

        y:
            height/2-
            (y-view.y)*
            view.scale

    };

}


function screenToWorld(x,y){

    return {

        x:
            (x-width/2)/
            view.scale+
            view.x,

        y:
            -(y-height/2)/
            view.scale+
            view.y

    };

}


/* =====================================================
   Parser
===================================================== */

function createFunction(source){

    let e =
        source
        .trim()
        .toLowerCase();


    e =
        e
        .replace(
            /^y\s*=\s*/,
            ""
        )
        .replace(
            /^f\s*\(\s*x\s*\)\s*=\s*/,
            ""
        )
        .replace(
            /π/g,
            "pi"
        );


    e =
        e.replace(
            /\bpi\b/g,
            "Math.PI"
        );


    e =
        e.replace(
            /\be\b/g,
            "Math.E"
        );


    e =
        e.replace(
            /\^/g,
            "**"
        );


    const functions=[

        "sin",
        "cos",
        "tan",

        "asin",
        "acos",
        "atan",

        "sqrt",
        "abs",

        "exp",

        "floor",
        "ceil",
        "round"

    ];


    functions.forEach(
        name=>{

            e =
                e.replace(

                    new RegExp(
                        "\\b"+
                        name+
                        "\\s*\\(",
                        "gi"
                    ),

                    "Math."+
                    name+
                    "("

                );

        }
    );


    e =
        e.replace(
            /\bln\s*\(/gi,
            "Math.log("
        );


    e =
        e.replace(
            /\blog\s*\(/gi,
            "Math.log10("
        );


    /* Implicit multiplication */

    e =
        e
        .replace(
            /(\d)\s*x/g,
            "$1*x"
        )
        .replace(
            /x\s*(\d)/g,
            "x*$1"
        )
        .replace(
            /\)\s*x/g,
            ")*x"
        )
        .replace(
            /x\s*\(/g,
            "x*("
        );


    try{

        const fn =
            new Function(

                "x",

                `"use strict";
                 return(${e})`

            );


        fn(0);

        return fn;

    }catch{

        return null;

    }

}


/* =====================================================
   Domain
===================================================== */

function domainAllows(
    x,
    domain
){

    if(
        !domain.trim()
    ){

        return true;

    }


    const d =
        domain
        .replace(
            /[{}]/g,
            ""
        )
        .replace(
            /\s/g,
            ""
        );


    let match;


    match =
        d.match(
            /^(-?\d+(?:\.\d+)?)<x<(-?\d+(?:\.\d+)?)$/
        );


    if(match){

        return (

            x>Number(match[1]) &&

            x<Number(match[2])

        );

    }


    match =
        d.match(
            /^(-?\d+(?:\.\d+)?)<=x<=(-?\d+(?:\.\d+)?)$/
        );


    if(match){

        return (

            x>=Number(match[1]) &&

            x<=Number(match[2])

        );

    }


    match =
        d.match(
            /^x>(-?\d+(?:\.\d+)?)$/
        );


    if(match){

        return x>Number(match[1]);

    }


    match =
        d.match(
            /^x>=(-?\d+(?:\.\d+)?)$/
        );


    if(match){

        return x>=Number(match[1]);

    }


    match =
        d.match(
            /^x<(-?\d+(?:\.\d+)?)$/
        );


    if(match){

        return x<Number(match[1]);

    }


    match =
        d.match(
            /^x<=(-?\d+(?:\.\d+)?)$/
        );


    if(match){

        return x<=Number(match[1]);

    }


    return true;

}


/* =====================================================
   Grid Step
===================================================== */

function niceStep(raw){

    const power =
        Math.pow(
            10,
            Math.floor(
                Math.log10(raw)
            )
        );


    const normalized =
        raw/power;


    let step;


    if(
        normalized<1.5
    ){

        step=1;

    }else if(
        normalized<3
    ){

        step=2;

    }else if(
        normalized<7
    ){

        step=5;

    }else{

        step=10;

    }


    return step*power;

}


/* =====================================================
   Grid
===================================================== */

function drawGrid(){

    const styles =
        getComputedStyle(
            document.body
        );


    ctx.fillStyle =
        styles.getPropertyValue(
            "--surface"
        );


    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    if(
        !showGrid
    ){

        drawAxes();

        return;

    }


    const left =
        view.x-
        width/
        (2*view.scale);


    const right =
        view.x+
        width/
        (2*view.scale);


    const bottom =
        view.y-
        height/
        (2*view.scale);


    const top =
        view.y+
        height/
        (2*view.scale);


    const step =
        niceStep(
            75/view.scale
        );


    ctx.strokeStyle =
        styles.getPropertyValue(
            "--grid"
        );


    ctx.lineWidth=1;

    ctx.beginPath();


    let startX =
        Math.floor(
            left/step
        )*step;


    for(
        let x=startX;
        x<=right;
        x+=step
    ){

        const px =
            worldToScreen(
                x,
                0
            ).x;


        ctx.moveTo(
            px,
            0
        );


        ctx.lineTo(
            px,
            height
        );

    }


    let startY =
        Math.floor(
            bottom/step
        )*step;


    for(
        let y=startY;
        y<=top;
        y+=step
    ){

        const py =
            worldToScreen(
                0,
                y
            ).y;


        ctx.moveTo(
            0,
            py
        );


        ctx.lineTo(
            width,
            py
        );

    }


    ctx.stroke();


    drawAxes();

}


/* =====================================================
   Axes
===================================================== */

function drawAxes(){

    const styles =
        getComputedStyle(
            document.body
        );


    const axis =
        worldToScreen(
            0,
            0
        );


    ctx.strokeStyle =
        styles.getPropertyValue(
            "--axis"
        );


    ctx.lineWidth=1.5;

    ctx.beginPath();


    if(
        axis.x>=0 &&
        axis.x<=width
    ){

        ctx.moveTo(
            axis.x,
            0
        );

        ctx.lineTo(
            axis.x,
            height
        );

    }


    if(
        axis.y>=0 &&
        axis.y<=height
    ){

        ctx.moveTo(
            0,
            axis.y
        );

        ctx.lineTo(
            width,
            axis.y
        );

    }


    ctx.stroke();


    drawLabels();

}


/* =====================================================
   Labels
===================================================== */

function drawLabels(){

    const styles =
        getComputedStyle(
            document.body
        );


    const left =
        view.x-
        width/
        (2*view.scale);


    const right =
        view.x+
        width/
        (2*view.scale);


    const bottom =
        view.y-
        height/
        (2*view.scale);


    const top =
        view.y+
        height/
        (2*view.scale);


    const step =
        niceStep(
            75/view.scale
        );


    const axis =
        worldToScreen(
            0,
            0
        );


    ctx.fillStyle =
        styles.getPropertyValue(
            "--muted"
        );


    ctx.font =
        "11px Inter, Arial, sans-serif";


    let startX =
        Math.floor(
            left/step
        )*step;


    for(
        let x=startX;
        x<=right;
        x+=step
    ){

        if(
            Math.abs(x)<
            step/100
        ){

            continue;

        }


        const px =
            worldToScreen(
                x,
                0
            ).x;


        const py =
            Math.min(
                Math.max(
                    axis.y+16,
                    14
                ),
                height-5
            );


        ctx.fillText(
            formatNumber(x),
            px+4,
            py
        );

    }


    let startY =
        Math.floor(
            bottom/step
        )*step;


    for(
        let y=startY;
        y<=top;
        y+=step
    ){

        if(
            Math.abs(y)<
            step/100
        ){

            continue;

        }


        const py =
            worldToScreen(
                0,
                y
            ).y;


        const px =
            Math.min(
                Math.max(
                    axis.x+7,
                    7
                ),
                width-35
            );


        ctx.fillText(
            formatNumber(y),
            px,
            py-5
        );

    }

}


function formatNumber(n){

    if(
        Math.abs(n)<1e-10
    ){

        return "0";

    }


    if(
        Math.abs(n)>=1000
    ){

        return n.toExponential(1);

    }


    return Number(
        n.toFixed(5)
    ).toString();

}


/* =====================================================
   Function Drawing
===================================================== */

function drawFunction(item){

    if(
        !item.visible
    ){

        return;

    }


    const fn =
        createFunction(
            item.expression
        );


    if(
        !fn
    ){

        return;

    }


    const left =
        view.x-
        width/
        (2*view.scale);


    const right =
        view.x+
        width/
        (2*view.scale);


    const samples =
        Math.min(
            1800,
            Math.max(
                700,
                Math.floor(
                    width*1.6
                )
            )
        );


    const dx =
        (right-left)/
        samples;


    ctx.strokeStyle =
        item.color;


    ctx.lineWidth=2.35;

    ctx.lineCap="round";

    ctx.lineJoin="round";


    ctx.beginPath();


    let started=false;

    let previousY=null;


    for(
        let i=0;
        i<=samples;
        i++
    ){

        const x =
            left+i*dx;


        if(
            !domainAllows(
                x,
                item.domain
            )
        ){

            started=false;

            previousY=null;

            continue;

        }


        let y;


        try{

            y=fn(x);

        }catch{

            started=false;

            previousY=null;

            continue;

        }


        if(
            !Number.isFinite(y) ||
            Math.abs(y)>1e7
        ){

            started=false;

            previousY=null;

            continue;

        }


        const point =
            worldToScreen(
                x,
                y
            );


        if(
            previousY!==null &&
            Math.abs(
                point.y-
                previousY
            )>
            height*1.35
        ){

            started=false;

        }


        if(
            !started
        ){

            ctx.moveTo(
                point.x,
                point.y
            );

            started=true;

        }else{

            ctx.lineTo(
                point.x,
                point.y
            );

        }


        previousY =
            point.y;

    }


    ctx.stroke();

}


/* =====================================================
   Draw
===================================================== */

function draw(){

    raf=null;

    drawGrid();


    for(
        const item of items
    ){

        drawFunction(item);

    }

}


function schedule(){

    if(
        raf!==null
    ){

        return;

    }


    raf =
        requestAnimationFrame(
            draw
        );

}


/* =====================================================
   Render Expressions
===================================================== */

function render(){

    expressionList.innerHTML="";


    items.forEach(
        (item,index)=>{

            const element =
                document.createElement(
                    "div"
                );


            element.className=
                "expression";


            element.innerHTML=`

                <button
                    class="expression-color"
                    style="
                        background:${item.color}
                    "
                    title="显示 / 隐藏">
                </button>


                <div
                    class="expression-main">

                    <input
                        class="expression-input"
                        value="${escapeHTML(item.expression)}"
                        placeholder="例如：sin(x)"
                        spellcheck="false"
                    >


                    <input
                        class="domain-input"
                        value="${escapeHTML(item.domain)}"
                        placeholder="定义域，例如：-5 < x < 5"
                        spellcheck="false"
                    >

                </div>


                <div
                    class="expression-tools">

                    <button
                        class="small-btn visibility">

                        ${
                            item.visible
                            ?"●"
                            :"○"
                        }

                    </button>


                    <button
                        class="small-btn delete">

                        ×

                    </button>

                </div>

            `;


            const input =
                element.querySelector(
                    ".expression-input"
                );


            const domain =
                element.querySelector(
                    ".domain-input"
                );


            const color =
                element.querySelector(
                    ".expression-color"
                );


            const visibility =
                element.querySelector(
                    ".visibility"
                );


            const del =
                element.querySelector(
                    ".delete"
                );


            input.addEventListener(
                "input",
                ()=>{

                    item.expression =
                        input.value;

                    schedule();

                }
            );


            domain.addEventListener(
                "input",
                ()=>{

                    item.domain =
                        domain.value;

                    schedule();

                }
            );


            function toggleVisibility(){

                item.visible =
                    !item.visible;

                render();

                schedule();

            }


            color.addEventListener(
                "click",
                toggleVisibility
            );


            visibility.addEventListener(
                "click",
                toggleVisibility
            );


            del.addEventListener(
                "click",
                ()=>{

                    items.splice(
                        index,
                        1
                    );


                    if(
                        items.length===0
                    ){

                        items.push({

                            expression:"",

                            domain:"",

                            color:colors[0],

                            visible:true

                        });

                    }


                    render();

                    schedule();

                }
            );


            expressionList.appendChild(
                element
            );

        }
    );


    count.textContent =
        items.length+
        " 个";

}


/* =====================================================
   Escape
===================================================== */

function escapeHTML(text){

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        );

}


/* =====================================================
   Add Expression
===================================================== */

document
    .getElementById(
        "addBtn"
    )
    .addEventListener(
        "click",
        ()=>{

            items.push({

                expression:"",

                domain:"",

                color:
                    colors[
                        items.length%
                        colors.length
                    ],

                visible:true

            });


            render();


            const inputs =
                document.querySelectorAll(
                    ".expression-input"
                );


            inputs[
                inputs.length-1
            ].focus();


            schedule();

        }
    );


/* =====================================================
   Quick Functions
===================================================== */

document
    .querySelectorAll(
        ".quick"
    )
    .forEach(
        button=>{

            button.addEventListener(
                "click",
                ()=>{

                    items.push({

                        expression:
                            button.dataset.exp,

                        domain:"",

                        color:
                            colors[
                                items.length%
                                colors.length
                            ],

                        visible:true

                    });


                    render();

                    schedule();

                }
            );

        }
    );


/* =====================================================
   Zoom
===================================================== */

function zoomAt(
    factor,
    px=width/2,
    py=height/2
){

    const before =
        screenToWorld(
            px,
            py
        );


    view.scale *=
        factor;


    view.scale =
        Math.max(
            12,
            Math.min(
                1500,
                view.scale
            )
        );


    const after =
        screenToWorld(
            px,
            py
        );


    view.x +=
        before.x-
        after.x;


    view.y +=
        before.y-
        after.y;


    schedule();

}


function zoomCenter(factor){

    zoomAt(
        factor,
        width/2,
        height/2
    );

}


/* =====================================================
   Zoom Buttons
===================================================== */

document
    .getElementById(
        "plusBtn"
    )
    .addEventListener(
        "click",
        ()=>{
            zoomCenter(1.2);
        }
    );


document
    .getElementById(
        "minusBtn"
    )
    .addEventListener(
        "click",
        ()=>{
            zoomCenter(.8333);
        }
    );


document
    .getElementById(
        "zoomPlus"
    )
    .addEventListener(
        "click",
        ()=>{
            zoomCenter(1.2);
        }
    );


document
    .getElementById(
        "zoomMinus"
    )
    .addEventListener(
        "click",
        ()=>{
            zoomCenter(.8333);
        }
    );


/* =====================================================
   Reset
===================================================== */

document
    .getElementById(
        "resetBtn"
    )
    .addEventListener(
        "click",
        ()=>{

            view.x=0;

            view.y=0;

            view.scale=70;

            schedule();

        }
    );


/* =====================================================
   Pointer Drag
===================================================== */

canvas.addEventListener(
    "pointerdown",
    event=>{

        dragging=true;


        lastPointer.x =
            event.clientX;


        lastPointer.y =
            event.clientY;


        canvas.classList.add(
            "dragging"
        );


        canvas.setPointerCapture(
            event.pointerId
        );

    }
);


canvas.addEventListener(
    "pointermove",
    event=>{

        const rect =
            canvas.getBoundingClientRect();


        const sx =
            event.clientX-
            rect.left;


        const sy =
            event.clientY-
            rect.top;


        const point =
            screenToWorld(
                sx,
                sy
            );


        coordinates.textContent =
            "x: "+
            formatNumber(
                point.x
            )+
            "   y: "+
            formatNumber(
                point.y
            );


        if(
            !dragging
        ){

            return;

        }


        const dx =
            event.clientX-
            lastPointer.x;


        const dy =
            event.clientY-
            lastPointer.y;


        view.x -=
            dx/
            view.scale;


        view.y +=
            dy/
            view.scale;


        lastPointer.x =
            event.clientX;


        lastPointer.y =
            event.clientY;


        schedule();

    }
);


function stopDragging(){

    dragging=false;

    canvas.classList.remove(
        "dragging"
    );

}


canvas.addEventListener(
    "pointerup",
    stopDragging
);


canvas.addEventListener(
    "pointercancel",
    stopDragging
);


/* =====================================================
   Wheel Zoom
===================================================== */

canvas.addEventListener(
    "wheel",
    event=>{

        event.preventDefault();


        const rect =
            canvas.getBoundingClientRect();


        const x =
            event.clientX-
            rect.left;


        const y =
            event.clientY-
            rect.top;


        zoomAt(

            event.deltaY<0
                ?1.12
                :.89,

            x,
            y

        );

    },
    {
        passive:false
    }
);


/* =====================================================
   Theme
===================================================== */

document
    .getElementById(
        "themeBtn"
    )
    .addEventListener(
        "click",
        ()=>{

            document.body.classList.toggle(
                "dark"
            );


            localStorage.setItem(

                "graphx-theme",

                document.body.classList.contains(
                    "dark"
                )
                ?"dark"
                :"light"

            );


            schedule();

        }
    );


if(
    localStorage.getItem(
        "graphx-theme"
    )==="dark"
){

    document.body.classList.add(
        "dark"
    );

}


/* =====================================================
   Grid Toggle
===================================================== */

document
    .getElementById(
        "gridBtn"
    )
    .addEventListener(
        "click",
        ()=>{

            showGrid =
                !showGrid;

            schedule();

        }
    );


/* =====================================================
   Fullscreen
===================================================== */

document
    .getElementById(
        "fullscreenBtn"
    )
    .addEventListener(
        "click",
        ()=>{

            if(
                !document.fullscreenElement
            ){

                document
                    .documentElement
                    .requestFullscreen?.();

            }else{

                document
                    .exitFullscreen?.();

            }

        }
    );


/* =====================================================
   Export
===================================================== */

document
    .getElementById(
        "exportBtn"
    )
    .addEventListener(
        "click",
        ()=>{

            const link =
                document.createElement(
                    "a"
                );


            link.download =
                "graphx-function.png";


            link.href =
                canvas.toDataURL(
                    "image/png"
                );


            link.click();

        }
    );


/* =====================================================
   Keyboard
===================================================== */

document.addEventListener(
    "keydown",
    event=>{

        if(
            event.target.tagName===
            "INPUT"
        ){

            return;

        }


        if(
            event.key==="+"||
            event.key==="="
        ){

            zoomCenter(1.2);

        }


        if(
            event.key==="-"
        ){

            zoomCenter(.8333);

        }


        if(
            event.key==="0"
        ){

            view.x=0;

            view.y=0;

            view.scale=70;

            schedule();

        }

    }
);


/* =====================================================
   Start
===================================================== */

render();


requestAnimationFrame(
    resize
);

</script>
